name: test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements-dev.txt

      - name: 跑测试（测试强制离线，不会调用真模型）
        env:
          LLM_DISABLE: "1"
        run: pytest -q

      - name: 冒烟（本地起服务，验 24 项）
        env:
          LLM_DISABLE: "1"
        run: |
          uvicorn server.main:app --host 127.0.0.1 --port 8000 --workers 1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/healthz && break || sleep 1
          done
          python scripts/smoke_remote.py http://127.0.0.1:8000
